<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TKG Japanese-English Learner's Dictionary - Advanced tag-based search">
    <title>Advanced Search - TKG Japanese-English Learner's Dictionary</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23FFEA00'/><circle cx='50' cy='50' r='30' fill='%23FFC107'/><circle cx='42' cy='42' r='8' fill='white' opacity='0.4'/></svg>">

    <style>
        /* Tag Search UI Styles */
        .tag-search-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #ddd;
        }
        .tag-search-section h2 { margin-bottom: 1rem; }
        .tag-search-modes {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .tag-search-modes button {
            padding: 0.5rem 1rem;
            border: 1px solid #ccc;
            background: #f5f5f5;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .tag-search-modes button.active {
            background: #4a90d9;
            color: white;
            border-color: #4a90d9;
        }
        .tag-filter-panel {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .filter-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .filter-actions button {
            padding: 0.5rem 1rem;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .filter-actions button:hover { background: #f0f0f0; }
        .filter-actions button.primary {
            background: #4a90d9;
            color: white;
            border-color: #4a90d9;
        }
        .filter-actions button.primary:hover { background: #3a7bc8; }
        .filter-group { margin-bottom: 1.5rem; }
        .filter-group:last-child { margin-bottom: 0; }
        .filter-group h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
            color: #333;
        }
        .filter-subgroup {
            margin-bottom: 0.75rem;
        }
        .filter-subgroup-label {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0.25rem;
            font-weight: 500;
        }
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .filter-options label {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .filter-options label:hover { background: #f0f0f0; }
        .filter-options label.checked {
            background: #e3f2fd;
            border-color: #4a90d9;
        }
        .tag-results { margin-top: 1.5rem; padding: 0 1.5rem; }
        .tag-results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .tag-results-count { font-weight: bold; color: #333; }
        .tag-results-export { display: flex; gap: 0.5rem; }
        .tag-results-export button {
            padding: 0.25rem 0.5rem;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .tag-results-list { display: grid; gap: 0.5rem; }
        .tag-result-item {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr auto;
            gap: 1rem;
            padding: 0.75rem;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-decoration: none;
            color: inherit;
            align-items: center;
        }
        .tag-result-item:hover {
            background: #f5f5f5;
            border-color: #4a90d9;
        }
        .tag-result-headword { font-weight: bold; }
        .tag-result-reading { color: #666; }
        .tag-result-gloss { color: #333; }
        .tag-result-tags { font-size: 0.75rem; color: #888; }
        .stats-panel { display: none; padding: 0 1.5rem; }
        .stats-panel.active { display: block; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .stats-card {
            background: #f9f9f9;
            padding: 1rem;
            border-radius: 8px;
        }
        .stats-card h3 { margin: 0 0 0.75rem 0; font-size: 1rem; }
        .stats-item {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
        .stats-item:last-child { border-bottom: none; }
        .stats-value { font-weight: bold; }
        .stats-bar {
            width: 60px;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 0.5rem;
        }
        .stats-bar-fill { height: 100%; background: #4a90d9; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .pagination button {
            padding: 0.5rem 1rem;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination button.current {
            background: #4a90d9;
            color: white;
            border-color: #4a90d9;
        }
        .page-info { padding: 0.5rem 1rem; color: #666; }
        @media (max-width: 768px) {
            .tag-result-item { grid-template-columns: 1fr; gap: 0.25rem; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>

</head>
<body>
<header class="nav-header">
    <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="advanced.html" class="nav-link">Advanced</a>
        <a href="browse.html" class="nav-link">Browse</a>
        <a href="recent.html" class="nav-link">Recent</a>
        <a href="random.html" class="nav-link">Random</a>
        <a href="pending.html" class="nav-link">Pending</a>
        <a href="about.html" class="nav-link">About</a>
    </nav>
    <div class="toggle-buttons">
        
    <div class="header-search">
        <input type="text" id="header-search-input" class="header-search-input" placeholder="Search..." autocomplete="off">
        <button type="button" id="header-search-button" class="header-search-button" title="Search">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
        </button>
    </div>
        <button id="examples-toggle" class="toggle-btn examples-toggle-btn" type="button" aria-pressed="true" title="Toggle example sentences">
            <span class="toggle-icon">例</span>
            <span class="toggle-label">Examples</span>
        </button>
        <button id="furigana-toggle" class="toggle-btn furigana-toggle-btn" type="button" aria-pressed="false" title="Toggle furigana (reading annotations above kanji)">
            <span class="toggle-icon">振</span>
            <span class="toggle-label">Furigana</span>
        </button>
    </div>
</header>
<main class="search-page">
    <h1>Advanced Search</h1>


    <!-- Tag-Based Search Section -->
    <section class="tag-search-section">
        <!-- Filter Mode Panel -->
        <div id="filter-panel" class="tag-filter-panel">
            <div class="tag-search-modes">
                <button class="mode-btn active" data-mode="filter">Filter</button>
                <button class="mode-btn" data-mode="stats">Statistics</button>
            </div>
            <div class="filter-actions">
                <button type="button" id="apply-filters" class="primary">Apply Filters</button>
                <button type="button" id="clear-filters">Clear All</button>
                <label style="display: inline-flex; align-items: center; gap: 0.25rem; margin-left: 0.5rem;">
                    <input type="checkbox" id="filter-and-mode"> AND mode (require all)
                </label>
            </div>

            <div class="filter-group">
                <h3>Vocabulary Tier</h3>
                <div class="filter-options" id="tier-filters">
                    <label><input type="checkbox" name="tier" value="basic"> basic</label>
                    <label><input type="checkbox" name="tier" value="core"> core</label>
                    <label><input type="checkbox" name="tier" value="general"> general</label>
                </div>
            </div>

            <div class="filter-group">
                <h3>Part of Speech</h3>
                <div class="filter-subgroup">
                    <div class="filter-subgroup-label">Verbs</div>
                    <div class="filter-options">
                        <label><input type="checkbox" name="pos" value="verb-godan"> godan</label>
                        <label><input type="checkbox" name="pos" value="verb-ichidan"> ichidan</label>
                        <label><input type="checkbox" name="pos" value="verb-suru"> suru</label>
                        <label><input type="checkbox" name="pos" value="verb-kuru"> kuru</label>
                        <label><input type="checkbox" name="pos" value="verb-irregular"> irregular</label>
                    </div>
                </div>
                <div class="filter-subgroup">
                    <div class="filter-subgroup-label">Adjectives</div>
                    <div class="filter-options">
                        <label><input type="checkbox" name="pos" value="adjective-i"> i-adjective</label>
                        <label><input type="checkbox" name="pos" value="adjective-na"> na-adjective</label>
                        <label><input type="checkbox" name="pos" value="adjective-no"> no-adjective</label>
                        <label><input type="checkbox" name="pos" value="adjective-taru"> taru-adjective</label>
                    </div>
                </div>
                <div class="filter-subgroup">
                    <div class="filter-subgroup-label">Other</div>
                    <div class="filter-options" id="pos-filters">
                        <label><input type="checkbox" name="pos" value="noun"> noun</label>
                        <label><input type="checkbox" name="pos" value="adverb"> adverb</label>
                        <label><input type="checkbox" name="pos" value="pronoun"> pronoun</label>
                        <label><input type="checkbox" name="pos" value="counter"> counter</label>
                        <label><input type="checkbox" name="pos" value="conjunction"> conjunction</label>
                        <label><input type="checkbox" name="pos" value="interjection"> interjection</label>
                        <label><input type="checkbox" name="pos" value="particle"> particle</label>
                        <label><input type="checkbox" name="pos" value="prefix"> prefix</label>
                        <label><input type="checkbox" name="pos" value="suffix"> suffix</label>
                        <label><input type="checkbox" name="pos" value="expression"> expression</label>
                        <label><input type="checkbox" name="pos" value="pre-noun-adjectival"> pre-noun-adjectival</label>
                        <label><input type="checkbox" name="pos" value="number"> number</label>
                        <label><input type="checkbox" name="pos" value="auxiliary"> auxiliary</label>
                        <label><input type="checkbox" name="pos" value="onomatopoeia"> onomatopoeia</label>
                    </div>
                </div>
            </div>

            <div class="filter-group">
                <h3>Formality</h3>
                <div class="filter-options" id="formality-filters">
                    <label><input type="checkbox" name="formality" value="formal"> formal</label>
                    <label><input type="checkbox" name="formality" value="neutral"> neutral</label>
                    <label><input type="checkbox" name="formality" value="informal"> informal</label>
                    <label><input type="checkbox" name="formality" value="vulgar"> vulgar</label>
                </div>
            </div>
        </div>

        <!-- Stats Panel -->
        <div id="stats-panel" class="stats-panel">
            <div class="stats-grid" id="stats-grid"></div>
        </div>

        <!-- Results Area -->
        <div id="tag-results" class="tag-results" style="display: none;">
            <div class="tag-results-header">
                <span class="tag-results-count" id="tag-results-count"></span>
                <div class="tag-results-export">
                    <button type="button" id="export-csv">Export CSV</button>
                    <button type="button" id="export-json">Export JSON</button>
                    <button type="button" id="copy-ids">Copy IDs</button>
                </div>
            </div>
            <div id="tag-results-list" class="tag-results-list"></div>
            <div id="tag-pagination" class="pagination"></div>
        </div>
    </section>


    <noscript>
        <div class="noscript-notice">
            <p>JavaScript is required for the advanced search feature. You can still <a href="browse.html">browse entries</a> by kana row.</p>
        </div>
    </noscript>
</main>

<script src="search-index.js"></script>
<script src="tag-search.js"></script>

<footer>
    <p><a href="index.html">TKG Japanese-English Learner's Dictionary</a></p>
</footer>
<script>
(function() {
    'use strict';

    var searchInput = document.getElementById('header-search-input');
    var searchButton = document.getElementById('header-search-button');

    if (!searchInput || !searchButton) return;

    function detectQueryType(query) {
        if (/[぀-ゟ゠-ヿ一-龯]/.test(query)) {
            return 'japanese';
        }
        if (/^[a-z]+$/i.test(query)) {
            return query.length <= 10 ? 'romaji' : 'english';
        }
        return 'english';
    }

    function performSearch() {
        var query = searchInput.value.trim();
        if (!query) return;

        // Redirect to index.html with search parameter
        var searchType = detectQueryType(query);
        window.location.href = 'index.html?q=' + encodeURIComponent(query) + '&type=' + searchType;
    }

    searchButton.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') performSearch();
    });
})();
</script>
<script>
(function() {
    var btn = document.getElementById('furigana-toggle');
    if (!btn) return;

    // Check saved preference
    var hidden = localStorage.getItem('furiganaHidden') === 'true';

    function updateState() {
        document.body.classList.toggle('furigana-hidden', hidden);
        btn.setAttribute('aria-pressed', !hidden);
        btn.classList.toggle('active', !hidden);
    }

    // Apply initial state
    updateState();

    // Toggle on click
    btn.addEventListener('click', function() {
        hidden = !hidden;
        localStorage.setItem('furiganaHidden', hidden);
        updateState();
    });
})();
</script>
<script>
(function() {
    var btn = document.getElementById('examples-toggle');
    if (!btn) return;

    // Check saved preference - default to showing examples (hidden = false)
    var hidden = localStorage.getItem('examplesHidden') === 'true';

    function updateState() {
        document.body.classList.toggle('examples-hidden', hidden);
        btn.setAttribute('aria-pressed', !hidden);
        btn.classList.toggle('active', !hidden);
    }

    // Apply initial state
    updateState();

    // Toggle on click
    btn.addEventListener('click', function() {
        hidden = !hidden;
        localStorage.setItem('examplesHidden', hidden);
        updateState();
    });
})();
</script>
</body>
</html>
