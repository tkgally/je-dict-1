<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>je-dict-1 - Japanese-English Dictionary</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>je-dict-1</h1>
            <p class="subtitle">Japanese-English Learner's Dictionary</p>
            <div class="header-controls">
                <button
                    id="furigana-toggle"
                    class="furigana-toggle-btn"
                    type="button"
                    aria-pressed="false"
                    title="Toggle furigana (reading annotations above kanji)"
                >
                    <span class="furigana-icon">振</span>
                    <span class="furigana-label">Furigana</span>
                </button>
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <h2>Browse Entries</h2>
                <nav id="entry-browser" class="entry-browser"></nav>
            </aside>

            <main>
                <section class="search-section">
                    <form id="search-form" class="search-form">
                        <div class="search-input-wrapper">
                            <input
                                type="text"
                                id="search-input"
                                placeholder="Search Japanese, English, or romaji..."
                                autocomplete="off"
                                spellcheck="false"
                            >
                            <button type="submit" id="search-button">Search</button>
                        </div>
                        <div class="search-options">
                            <label>
                                <input type="radio" name="search-type" value="auto" checked>
                                Auto-detect
                            </label>
                            <label>
                                <input type="radio" name="search-type" value="japanese">
                                Japanese
                            </label>
                            <label>
                                <input type="radio" name="search-type" value="english">
                                English
                            </label>
                            <label>
                                <input type="radio" name="search-type" value="romaji">
                                Romaji
                            </label>
                        </div>
                    </form>
                </section>

                <section id="results-section" class="results-section hidden">
                    <h2 id="results-heading">Results</h2>
                    <div id="results-list" class="results-list"></div>
                </section>

                <section id="entry-section" class="entry-section hidden">
                    <div id="entry-display" class="entry-display"></div>
                </section>

                <section id="welcome-section" class="welcome-section">
                    <p>Welcome to je-dict-1, a Japanese-English dictionary designed for learners.</p>
                    <p>Enter a search term above, or browse entries by kana row on the left.</p>
                    <div id="stats" class="stats"></div>
                </section>
            </main>
        </div>

        <footer>
            <p>je-dict-1 &middot; A learner's dictionary emphasizing quality over quantity</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
